# ---------------------------------------------------------------------------
# Content Planner Backend
# Port 8081 (der UI-Service läuft auf 8080, Angular auf 4200)
# ---------------------------------------------------------------------------
quarkus.application.name=content-planner-backend
quarkus.http.port=8081
quarkus.http.test-port=8091

# --- Datenbank: H2 im File-Modus (eine Datei unter ./data) ------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/content-planner;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.sql-load-script=no-file
%dev.quarkus.hibernate-orm.log.sql=false

# Tests: eigene In-Memory-DB, bei jedem Lauf frisch
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# --- OpenAPI-Contract -------------------------------------------------------
# Beim Build wird der Contract nach ./openapi geschrieben und eingecheckt.
# So sehen Menschen UND Agents im Diff sofort, wenn sich die API ändert.
quarkus.smallrye-openapi.info-title=Content Planner Backend API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Business-Logik und Persistenz für geplante Social-Media-Posts. Alle Regeln (Zeichenlimits, Statuswechsel, Termine) werden hier geprüft.
quarkus.smallrye-openapi.store-schema-directory=openapi
quarkus.swagger-ui.always-include=true
