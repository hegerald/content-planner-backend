name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build und Tests (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Gleiches Skript wie lokal (Skill verify-backend): Build, Tests, OpenAPI-Contract aktuell?
      - name: Build, Tests und Contract
        run: node scripts/verify.mjs
