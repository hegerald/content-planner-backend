name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build und Tests (Quarkus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build und Tests
        run: mvn -B verify
      - name: OpenAPI-Contract aktuell?
        run: git diff --exit-code -- openapi/ || (echo "::error::openapi/ ist veraltet – mvn package ausführen und committen" && exit 1)
